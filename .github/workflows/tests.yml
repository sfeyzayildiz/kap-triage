name: tests

# ruff, pytest and reported-result checks on each PR and push to main.
# No licensed data, no .env, no network calls to Matriks or Ollama: tests use made-up data only
# (tests/conftest.py points the data folder to an empty temporary folder).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      # without the "search" extra: torch / sentence-transformers are loaded lazily and tests never call them
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Check reported results
        run: python main.py verify-results

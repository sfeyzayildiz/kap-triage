name: self-tests

# Runs every module self-test on each PR and push to main.
# No data, no .env, no network calls to Matriks or Ollama: self-tests use in-memory data only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Only what the self-tests import (see the comment in requirements-test.txt).
      - name: Install
        run: pip install -r requirements-test.txt
      - name: Self-tests
        run: python scripts/run_self_tests.py
